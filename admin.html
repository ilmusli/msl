<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ilmusli Admin</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#000;--line:#2b2b2b;--text:#fff;--muted:#a3a3a3;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.hide{display:none!important}
#gate{max-width:340px;margin:12vh auto 0;padding:0 20px}
main{max-width:680px;margin:0 auto;padding:0 20px 60px}
h1{font-size:12px;letter-spacing:.3em;font-weight:500;text-align:center;margin:26px 0 4px}
.sub{text-align:center;font-size:10px;letter-spacing:.24em;color:var(--muted);margin:0 0 24px}
.k{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:22px 0 8px}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;padding:12px;margin-bottom:8px;border-radius:0}
textarea{min-height:90px;resize:vertical}
.btn{width:100%;border:1px solid var(--text);background:none;color:var(--text);font:inherit;font-size:11px;letter-spacing:.14em;padding:13px;cursor:pointer;margin-bottom:10px;text-transform:uppercase}
.btn.f,.btn:hover{background:var(--text);color:var(--bg)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.msg{text-align:center;font-size:13px;min-height:22px;margin:4px 0 10px}
.nav{display:flex;gap:16px;overflow-x:auto;padding:14px 20px 4px;max-width:720px;margin:auto;font-size:10px;letter-spacing:.14em;white-space:nowrap}
.nav a{color:var(--muted);text-decoration:none;text-transform:uppercase;padding-bottom:4px;border-bottom:1px solid transparent}
.nav a.on{color:var(--text);border-color:var(--text)}
.who{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.1em;padding:10px 20px 0;max-width:720px;margin:auto}
.who a{cursor:pointer;text-decoration:underline}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kp div{border:1px solid var(--line);padding:16px 12px}
.kp b{display:block;font-size:20px;font-weight:500;margin-bottom:4px}
.kp small{font-size:9px;letter-spacing:.14em;color:var(--muted)}
.kp .w{grid-column:1/-1;border-color:var(--text)}.kp .w b{font-size:30px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.fm .w{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips button{border:1px solid var(--line);background:none;padding:9px 12px;font:inherit;font-size:11px;letter-spacing:.08em;cursor:pointer}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
ul{list-style:none;margin:0;padding:0}
li{border-bottom:1px solid var(--line)}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;font-size:13px;cursor:pointer;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;text-decoration:none}
.r small,.dt small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.r span{white-space:nowrap}
.dt{padding:0 0 14px;font-size:12px;color:var(--muted);line-height:1.9}
.dt a{color:var(--text)}
.lk{background:none;border:0;padding:0;font:inherit;color:var(--text);text-decoration:underline;cursor:pointer}
.em{color:var(--muted);font-size:13px;text-align:center;padding:24px 0}
.ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--text)}

<script>window.PAGES={"pos": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ilmusli POS<\/title>\n<style>\n:root{color-scheme:dark;--bg:#000;--panel:#000;--line:#2b2b2b;--text:#fff;--muted:#a3a3a3;--red:#ff6b61;--sans:\"Inter\",-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",system-ui,Arial,sans-serif}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}\n.hide{display:none!important}\n#gate{max-width:340px;margin:12vh auto 0;padding:0 20px}\nmain{max-width:980px;margin:0 auto;padding:0 20px 60px}\nh1{font-size:12px;letter-spacing:.3em;font-weight:500;text-align:center;margin:30px 0 4px}\n.sub{text-align:center;font-size:10px;letter-spacing:.24em;color:var(--muted);margin:0 0 26px}\n.k{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:22px 0 8px}\ninput{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;padding:12px;margin-bottom:10px;border-radius:0}\n.btn{width:100%;border:1px solid var(--text);background:none;color:var(--text);font:inherit;font-size:11px;letter-spacing:.14em;padding:13px;cursor:pointer;margin-bottom:10px;text-transform:uppercase}\n.btn.f,.btn:hover:not(:disabled){background:var(--text);color:var(--bg)}\n.btn:disabled{opacity:.35;cursor:not-allowed}\n:focus-visible{outline:2px solid var(--text);outline-offset:2px}\n.msg{text-align:center;font-size:13px;min-height:22px;margin:4px 0 10px}\n.who{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.1em;padding:14px 20px 0;max-width:980px;margin:auto}\n.who a{cursor:pointer;text-decoration:underline}\n.cols{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}\n@media(max-width:800px){.cols{grid-template-columns:1fr;gap:0}}\n.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}\n.pt{border:1px solid var(--line);background:none;padding:16px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit}\n.pt:hover{border-color:var(--text)}\n.pt b{display:block;font-size:13px;font-weight:500;letter-spacing:.08em;margin-bottom:8px}\n.pt span{font-size:13px}.pt s{color:var(--muted);font-size:12px;margin-left:6px}\nul{list-style:none;margin:0;padding:0}\nli{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}\nli small{display:block;color:var(--muted);font-size:11px;margin-top:2px}\n.q{display:flex;align-items:center;gap:8px}\n.q button{width:28px;height:28px;border:1px solid var(--line);background:none;cursor:pointer;font:inherit}\n.q button:hover{border-color:var(--text)}\n.row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}\n.row.t{font-size:20px;border-top:1px solid var(--text);margin-top:8px;padding-top:12px}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}\n.chips button{border:1px solid var(--line);background:none;padding:10px 14px;font:inherit;font-size:12px;cursor:pointer}\n.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text)}\n.em{color:var(--muted);font-size:13px;text-align:center;padding:22px 0}\ndialog{border:1px solid var(--text);border-radius:0;padding:22px;width:min(360px,92vw)}\ndialog::backdrop{background:#000c}\n#rc{font-size:13px}#rc h2{font-size:12px;letter-spacing:.3em;font-weight:500;text-align:center;margin:0 0 4px}\n#rc .c{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.08em}\n#rc hr{border:0;border-top:1px dashed #999;margin:10px 0}\n#toast{position:fixed;bottom:16px;left:16px;right:16px;margin:auto;max-width:380px;background:var(--text);color:var(--bg);padding:12px 16px;text-align:center;font-size:13px;display:none}\n@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0;width:100%}}\n.sg{display:block;width:85px;height:52px;margin:0 auto 8px;background:linear-gradient(110deg,#f4f4f6 0%,#8a8a92 22%,#dcdce0 40%,#6e6e76 52%,#ececf0 68%,#9a9aa2 85%,#f4f4f6 100%);background-size:250% 100%;animation:shine 3.5s linear infinite;-webkit-mask:var(--sig) center/contain no-repeat;mask:var(--sig) center/contain no-repeat}#gate .sg{width:110px;height:67px;margin-bottom:12px}@keyframes shine{to{background-position:-250% 0}}<\/style>\n<style>#gate{display:none!important}.who{display:none!important}.sg{display:none!important}nav.nav{display:none!important}<\/style><\/head>\n<body>\n\n<div id=\"gate\">\n  <span class=\"sg\" role=\"img\" aria-label=\"ilmusli\"><\/span><p class=\"sub\">POS<\/p>\n  <input id=\"pw\" type=\"password\" placeholder=\"Code\" autocomplete=\"off\">\n  <button class=\"btn f\" id=\"go\">Enter<\/button>\n  <div class=\"msg\" id=\"gm\"><\/div>\n<\/div>\n\n<div id=\"app\" class=\"hide\">\n  <div class=\"who\"><span id=\"wh\"><\/span><a id=\"out\">LOGOUT<\/a><\/div>\n  <span class=\"sg\" role=\"img\" aria-label=\"ilmusli\"><\/span><h1>POS<\/h1><p class=\"sub\">IN-STORE SALES<\/p>\n  <main>\n    <div class=\"cols\">\n      <section>\n        <p class=\"k\" style=\"margin-top:0\">PRODUCTS<\/p>\n        <div class=\"pg\" id=\"pg\"><\/div>\n        <p class=\"k\">SALES ON THIS DEVICE<\/p>\n        <ul id=\"ss\"><\/ul>\n        <div id=\"uq\" class=\"hide\"><p class=\"k\">NOT SAVED YET<\/p><div class=\"msg\" id=\"um\"><\/div><button class=\"btn\" id=\"retry\">Retry saving<\/button><\/div>\n      <\/section>\n      <aside>\n        <p class=\"k\" style=\"margin-top:0\">CURRENT SALE<\/p>\n        <ul id=\"cart\"><\/ul>\n        <label class=\"row\" style=\"align-items:center\">Discount (EGP)<input id=\"disc\" type=\"number\" min=\"0\" inputmode=\"decimal\" value=\"0\" style=\"width:110px;margin:0;text-align:right\"><\/label>\n        <div class=\"row\"><span>Subtotal<\/span><span id=\"sub\">0 EGP<\/span><\/div>\n        <div class=\"row t\"><span>Total<\/span><b id=\"tot\">0 EGP<\/b><\/div>\n        <p class=\"k\">PAYMENT<\/p>\n        <div class=\"chips\" id=\"pm\"><button class=\"on\" data-m=\"Cash\">Cash<\/button><button data-m=\"Card\">Card<\/button><button data-m=\"Wallet\">Wallet<\/button><\/div>\n        <div id=\"cb\"><input id=\"paid\" type=\"number\" min=\"0\" inputmode=\"decimal\" placeholder=\"Cash received\"><div class=\"row\"><span>Change<\/span><b id=\"chg\">0 EGP<\/b><\/div><\/div>\n        <div class=\"msg\" id=\"pmsg\"><\/div>\n        <button class=\"btn f\" id=\"pay\" disabled>Complete sale<\/button>\n        <button class=\"btn\" id=\"clr\">Clear<\/button>\n      <\/aside>\n    <\/div>\n  <\/main>\n<\/div>\n\n<dialog id=\"vd\">\n  <div id=\"vb\"><\/div>\n  <button class=\"btn f\" id=\"vadd\" style=\"margin-top:14px\">Add to sale<\/button>\n  <button class=\"btn\" id=\"vx\">Cancel<\/button>\n<\/dialog>\n<dialog id=\"rd\">\n  <div id=\"rc\"><\/div>\n  <button class=\"btn f\" id=\"prt\" style=\"margin-top:14px\">Print<\/button>\n  <button class=\"btn\" id=\"rx\">Close<\/button>\n<\/dialog>\n<div id=\"toast\" role=\"status\"><\/div>\n\n<script type=\"module\">\nimport {initializeApp} from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js\";\nimport {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js\";\nimport {getFirestore,collection,addDoc,getDocs,doc,runTransaction,updateDoc} from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js\";\nconst app=initializeApp({apiKey:\"AIzaSyAk3eUzXSS6MIm_UAfY-VYE0bQnK36771w\",authDomain:\"ilmusli.firebaseapp.com\",projectId:\"ilmusli\",storageBucket:\"ilmusli.firebasestorage.app\",messagingSenderId:\"107954044527\",appId:\"1:107954044527:web:f0c4ae170ca492da31979a\"});\nconst auth=getAuth(app),db=getFirestore(app);\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst fm=n=>Math.round(n||0).toLocaleString('en-US')+' EGP';\nconst OWNER='leilmusli@gmail.com';\n\n/* Catalog mirrors the store (ilmusli.html): same ids, names, current prices, colors and sizes.\n   If you change a product or price on the store, change it here too. */\nconst BASE=[\n {id:7,name:'BOXY FIT',price:650,list:800,colors:['Black','White','Grey'],sizes:['S','M','L','XL']},\n {id:8,name:'WIDE LEG',price:850,list:1200,colors:['Black','Graphite'],sizes:['30','32','34','36']},\n {id:9,name:'BALACLAVA',price:350,list:500,colors:['Black'],sizes:['One size']},\n {id:11,name:'VISOR CAP',price:250,list:400,colors:['Black'],sizes:['One size']},\n {id:12,name:'THE VAULT',price:1900,list:2900,colors:['Black'],sizes:['S · 30','M · 32','L · 34','XL · 36']}\n];\nlet CAT=BASE,ALL=BASE,track=false;\nlet cart=[],method='Cash',user=null,sess=[],pick=null;\nconst load=()=>{try{return JSON.parse(localStorage.getItem('pos_unsaved'))||[]}catch(e){return[]}};\nconst store=a=>{try{localStorage.setItem('pos_unsaved',JSON.stringify(a))}catch(e){}};\nfunction toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}\n\n/* login: same owner-only gate as the sales page */\n$('go').onclick=async()=>{\n  const p=$('pw').value;if(!p)return $('gm').textContent='Enter your code';\n  try{await signInWithEmailAndPassword(auth,OWNER,p);$('pw').value='';$('gm').textContent=''}\n  catch(x){$('gm').textContent=(x.code==='auth/invalid-credential'||x.code==='auth/wrong-password')?'Wrong code':'Could not sign in: '+(x.code||x.message)}\n};\n$('pw').addEventListener('keydown',e=>e.key==='Enter'&&$('go').click());\n$('out').onclick=()=>signOut(auth);\nonAuthStateChanged(auth,u=>{\n  if(u&&(u.email||'').toLowerCase()!==OWNER){signOut(auth);$('gm').textContent='This page is for the owner only';return}\n  user=u;$('gate').classList.toggle('hide',!!u);$('app').classList.toggle('hide',!u);\n  if(!u)return;\n  $('wh').textContent=(u.email||'').toUpperCase();\n  loadProducts().then(()=>{draw();if(load().length)flush()});drawUnsaved();\n});\n\n/* stock: products/{id}.stock = {\"Color__Size\": qty}. THE VAULT uses the stock of its 4 items. */\nconst vk=(c,z)=>String(c+'__'+z).replace(/[^A-Za-z0-9_]/g,'-');\nconst parts=l=>l.id===12?(z=>[[7,'Black',z[0]],[8,'Black',z[1]],[9,'Black','One size'],[11,'Black','One size']])(String(l.size).split(' · ')):[[l.id,l.color,l.size]];\nconst inCart=(id,c,z)=>cart.reduce((n,l)=>n+parts(l).filter(x=>x[0]===id&&x[1]===c&&x[2]===z).length*l.q,0);\nconst have=(id,c,z)=>{const p=ALL.find(x=>x.id===id);return p&&p.stock?(p.stock[vk(c,z)]||0):0};\nconst left=(p,c,z)=>track?Math.min(...parts({id:p.id,color:c,size:z}).map(([i,cc,zz])=>have(i,cc,zz)-inCart(i,cc,zz))):Infinity;\nconst anyLeft=p=>!track||p.colors.some(c=>p.sizes.some(z=>left(p,c,z)>0));\nasync function loadProducts(){\n  try{const sn=await getDocs(collection(db,'products'));\n    if(sn.empty){track=false;ALL=BASE}\n    else{ALL=sn.docs.map(d=>Object.assign({id:+d.id},d.data())).sort((a,b)=>(a.order||0)-(b.order||0));track=true}\n  }catch(e){track=false;ALL=BASE}\n  CAT=ALL.filter(p=>p.active!==false);\n}\nfunction drawGrid(){\n  $('pg').innerHTML=CAT.map(p=>{const ok=anyLeft(p);return `<button class=\"pt\" data-id=\"${p.id}\" ${ok?'':'disabled style=\"opacity:.35;cursor:not-allowed\"'}><b>${esc(p.name)}<\/b><span>${fm(p.price)}<\/span><s>${fm(p.list)}<\/s>${ok?'':'<small style=\"display:block;margin-top:6px;color:var(--red)\">Out of stock<\/small>'}<\/button>`}).join('');\n  document.querySelectorAll('.pt').forEach(b=>b.onclick=()=>open(+b.dataset.id));\n}\nfunction open(id){\n  const p=CAT.find(x=>x.id===id);\n  if(p.colors.length===1&&p.sizes.length===1)return add(p,p.colors[0],p.sizes[0]);\n  pick={p,c:p.colors[0],s:null};\n  $('vb').innerHTML=`<h1 style=\"margin-top:0\">${esc(p.name)}<\/h1><p class=\"k\">COLOR<\/p><div class=\"chips\" id=\"vc\">${p.colors.map(c=>`<button data-v=\"${esc(c)}\">${esc(c)}<\/button>`).join('')}<\/div><p class=\"k\">SIZE<\/p><div class=\"chips\" id=\"vs\"><\/div>`;\n  const drawS=()=>{\n    $('vs').innerHTML=p.sizes.map(z=>{const n=left(p,pick.c,z);return `<button data-v=\"${esc(z)}\" ${n<=0?'disabled style=\"opacity:.35;cursor:not-allowed\"':''}>${esc(z)}${track&&n>0&&n<=3?' ('+n+' left)':''}<\/button>`}).join('');\n    $('vs').querySelectorAll('button').forEach(b=>b.onclick=()=>{pick.s=b.dataset.v;$('vs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('vadd').disabled=false});\n  };\n  $('vc').querySelectorAll('button').forEach(b=>b.onclick=()=>{pick.c=b.dataset.v;pick.s=null;$('vadd').disabled=true;$('vc').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));drawS()});\n  $('vc').firstElementChild.classList.add('on');$('vadd').disabled=true;drawS();$('vd').showModal();\n}\n$('vadd').onclick=()=>{if(!pick||!pick.s)return;add(pick.p,pick.c,pick.s);$('vd').close()};\n$('vx').onclick=()=>$('vd').close();\nfunction add(p,c,z){\n  if(left(p,c,z)<=0)return toast('Out of stock');\n  const k=[p.id,c,z].join('|'),l=cart.find(x=>x.k===k);\n  if(l)l.q++;else cart.push({k,id:p.id,name:p.name,color:c,size:z,price:p.price,q:1});\n  draw();\n}\nconst sub=()=>cart.reduce((a,l)=>a+l.price*l.q,0);\nconst disc=()=>Math.min(Math.max(+$('disc').value||0,0),sub());\nconst total=()=>sub()-disc();\n\nfunction draw(){drawGrid();\n  $('cart').innerHTML=cart.length?cart.map(l=>`<li><div>${esc(l.name)}<small>${esc(l.color)} · ${esc(l.size)} · ${fm(l.price)}<\/small><\/div><div class=\"q\"><button data-k=\"${esc(l.k)}\" data-d=\"-1\" aria-label=\"Less\">−<\/button><span>${l.q}<\/span><button data-k=\"${esc(l.k)}\" data-d=\"1\" aria-label=\"More\">+<\/button><\/div><\/li>`).join(''):'<li><span class=\"em\" style=\"width:100%\">Tap a product to start a sale<\/span><\/li>';\n  $('cart').querySelectorAll('.q button').forEach(b=>b.onclick=()=>{const l=cart.find(x=>x.k===b.dataset.k);if(+b.dataset.d>0&&left(CAT.find(x=>x.id===l.id),l.color,l.size)<=0)return toast('No more in stock');l.q+=+b.dataset.d;if(l.q<=0)cart=cart.filter(x=>x!==l);draw()});\n  $('sub').textContent=fm(sub());$('tot').textContent=fm(total());\n  $('cb').classList.toggle('hide',method!=='Cash');\n  const paid=+$('paid').value||0;\n  $('chg').textContent=fm(Math.max(paid-total(),0));\n  $('pay').disabled=!cart.length||(method==='Cash'&&paid<total());\n}\ndocument.querySelectorAll('#pm button').forEach(b=>b.onclick=()=>{method=b.dataset.m;document.querySelectorAll('#pm button').forEach(x=>x.classList.toggle('on',x===b));draw()});\n$('disc').oninput=draw;$('paid').oninput=draw;\n$('clr').onclick=()=>{cart=[];$('disc').value=0;$('paid').value='';draw()};\n\n/* a POS sale is saved as a normal order, so the sales and HR pages show it live */\nfunction mkOrder(){\n  const sb=sub(),ds=disc(),t=sb-ds,paid=method==='Cash'?+$('paid').value:t;\n  return {id:'POS-'+Date.now().toString(36).toUpperCase(),createdAt:Date.now(),deliveredAt:Date.now(),status:'Delivered',channel:'pos',\n    uid:user.uid,email:user.email,name:'In-store customer',\n    items:cart.map(l=>({id:l.id,name:l.name,color:l.color,size:l.size,q:l.q,price:l.price})),\n    sub:sb,discount:ds,shipping:0,gov:'In store',area:'',code:'',payment:method,total:t,\n    redeem:0,redeemValue:0,pointsUsed:0,address:'',phone:'',phone2:'',contactEmail:'',notes:'',\n    received:paid,change:Math.max(paid-t,0)};\n}\nconst NOPERM=e=>e&&(e.code==='permission-denied'||/permission/i.test(e.message||''));\nasync function saveOrder(o){\n  try{await addDoc(collection(db,'orders'),o)}\n  catch(e){if(!NOPERM(e))throw e;\n    /* old rules: create as Pending, then mark Delivered */\n    const r=await addDoc(collection(db,'orders'),Object.assign({},o,{status:'Pending'}));\n    await updateDoc(r,{status:'Delivered'})}\n}\n/* sale + stock change in one transaction: both happen or neither */\nasync function sellTracked(o){\n  const need={};\n  o.items.forEach(i=>parts(i).forEach(([id,c,z])=>{const k=vk(c,z);need[id]=need[id]||{};need[id][k]=(need[id][k]||0)+i.q}));\n  const ids=Object.keys(need);\n  await runTransaction(db,async tx=>{\n    const refs=ids.map(id=>doc(db,'products',String(id)));\n    const snaps=await Promise.all(refs.map(r=>tx.get(r)));\n    snaps.forEach((sn,n)=>{\n      const st=Object.assign({},(sn.exists()&&sn.data().stock)||{});\n      for(const [k,q] of Object.entries(need[ids[n]])){\n        if((st[k]||0)<q){const er=new Error('Not enough stock: '+((sn.exists()&&sn.data().name)||ids[n])+' '+k.replace('__',' / '));er.stock=true;throw er}\n        st[k]-=q}\n      tx.update(refs[n],{stock:st,updatedAt:Date.now()});\n    });\n    tx.set(doc(collection(db,'orders')),o);\n  });\n}\n$('pay').onclick=async()=>{\n  const o=mkOrder();$('pay').disabled=true;$('pmsg').textContent='Saving...';\n  try{\n    if(track)await sellTracked(o);else await saveOrder(o);\n    $('pmsg').textContent='';\n    if(track)await loadProducts();\n  }catch(e){\n    if(e&&e.stock){$('pmsg').textContent=e.message;await loadProducts();draw();return}\n    const q=load();q.push(o);store(q);drawUnsaved(e.code||e.message);$('pmsg').textContent='';toast('Not saved to the store yet. It is kept on this device.')\n  }\n  sess.unshift(o);cart=[];$('disc').value=0;$('paid').value='';draw();drawSess();receipt(o);\n};\nasync function flush(){\n  const q=load(),left=[];let err='';\n  for(const o of q){try{const oo=Object.assign({},o,{uid:user.uid,email:user.email});if(track)await sellTracked(oo);else await saveOrder(oo)}catch(e){left.push(o);err=e.code||e.message}}\n  store(left);drawUnsaved(err);if(q.length&&!left.length)toast('All sales saved')\n}\n$('retry').onclick=flush;\nfunction drawUnsaved(err){\n  const n=load().length;$('uq').classList.toggle('hide',!n);\n  $('um').textContent=n?n+' sale(s) are only on this device'+(err?'. Reason: '+err:''):'';\n}\nfunction drawSess(){\n  $('ss').innerHTML=sess.length?sess.slice(0,8).map((o,i)=>`<li><div>${esc(o.id)}<small>${new Date(o.createdAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${esc(o.payment)}<\/small><\/div><span><b>${fm(o.total)}<\/b> <a href=\"#\" data-i=\"${i}\" style=\"color:var(--muted);margin-left:8px\">Receipt<\/a><\/span><\/li>`).join(''):'<li><span class=\"em\" style=\"width:100%\">No sales yet<\/span><\/li>';\n  $('ss').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();receipt(sess[+a.dataset.i])});\n}\ndrawSess();\n\nfunction receipt(o){\n  $('rc').innerHTML=`<h2>ILMUSLI<\/h2><div class=\"c\">${esc(o.id)}<br>${new Date(o.createdAt).toLocaleString('en-GB')}<\/div><hr>`\n  +o.items.map(i=>`<div class=\"row\"><span>${i.q} × ${esc(i.name)}<br><small style=\"color:#666\">${esc(i.color)} · ${esc(i.size)}<\/small><\/span><span>${fm(i.price*i.q)}<\/span><\/div>`).join('')\n  +`<hr><div class=\"row\"><span>Subtotal<\/span><span>${fm(o.sub)}<\/span><\/div>`\n  +(o.discount?`<div class=\"row\"><span>Discount<\/span><span>- ${fm(o.discount)}<\/span><\/div>`:'')\n  +`<div class=\"row\"><b>Total<\/b><b>${fm(o.total)}<\/b><\/div><div class=\"row\"><span>Payment<\/span><span>${esc(o.payment)}<\/span><\/div>`\n  +(o.payment==='Cash'?`<div class=\"row\"><span>Received<\/span><span>${fm(o.received)}<\/span><\/div><div class=\"row\"><span>Change<\/span><span>${fm(o.change)}<\/span><\/div>`:'')\n  +`<hr><div class=\"c\">THANK YOU<\/div>`;\n  $('rd').showModal();\n}\n$('prt').onclick=()=>window.print();\n$('rx').onclick=()=>$('rd').close();\n<\/script>\n<script>document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href')||'';var m=h.match(/^([a-z]+)\\.html$/);if(m){e.preventDefault();parent.postMessage({go:m[1]},'*')}},true)<\/script><\/body>\n<\/html>\n", "sales": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"robots\" content=\"noindex,nofollow,noarchive\">\n<title>ilmusli · Sales<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap\">\n<style>\n:root{color-scheme:dark;--bg:#000;--panel:#000;--line:#2b2b2b;--text:#fff;--muted:#a3a3a3;--sans:\"Inter\",-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",system-ui,Arial,sans-serif}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}\n.hide{display:none!important}\nmain,#gate{max-width:560px;margin:0 auto;padding:0 20px 60px}\n#gate{margin-top:12vh;max-width:340px}\nh1{font-size:12px;letter-spacing:.3em;font-weight:500;text-align:center;margin:30px 0 4px}\n.sub{text-align:center;font-size:10px;letter-spacing:.24em;color:var(--muted);margin:0 0 26px}\n.k{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:26px 0 8px}\ninput,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;padding:12px;margin-bottom:10px;border-radius:0}\n.btn{width:100%;border:1px solid var(--text);background:none;color:var(--text);font:inherit;font-size:11px;letter-spacing:.14em;padding:13px;cursor:pointer;margin-bottom:10px;text-transform:uppercase}\n.btn.f,.btn:hover{background:var(--text);color:var(--bg)}\n.msg{text-align:center;font-size:13px;min-height:22px;margin:4px 0 10px}\n.who{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.1em;padding:14px 20px 0;max-width:560px;margin:auto}\n.who a{cursor:pointer;text-decoration:underline}\n.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.kp div{border:1px solid var(--line);padding:16px 12px}\n.kp b{display:block;font-size:22px;font-weight:500;margin-bottom:4   if(!u)return;$('wh').textContent=(u.email||'').toUpperCase();start(u);show(location.hash.slice(1));
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&typeof act==='function')act(b.dataset.act,b.dataset.id,b)});


let OR=[];
const TOOLS=[['pos.html','POS','Sell in the shop'],['sales.html','Sales','Revenue and orders, live'],['inventory.html','Inventory','Prices, costs and stock'],['customers.html','Customers','Who buys and who came back'],['shipping.html','Shipping','Couriers and cash on delivery'],['returns.html','Returns','Returns and exchanges'],['suppliers.html','Suppliers','Purchases and what you owe'],['expenses.html','Expenses','Monthly costs'],['coupons.html','Coupons','Discount codes'],['campaigns.html','Campaigns','WhatsApp messages by group'],['reports.html','Reports','Real profit'],['hr.html','Team (HR)','Staff, attendance, schedule']];
$('tl').innerHTML=TOOLS.map(t=>`<li><a class="r" href="#${t[0].replace('.html','')}"><div>${t[1]}<small>${t[2]}</small></div><span>&rarr;</span></a></li>`).join('');
function start(){watch(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(500)),s=>{OR=s.docs.map(d=>d.data());draw()})}
function draw(){
  const t0=new Date();t0.setHours(0,0,0,0);
  const ok=OR.filter(o=>o.status!=='Cancelled'),td=ok.filter(o=>(o.createdAt||0)>=+t0);
  $('kp').innerHTML=[[fm(sum(td,o=>o.total)),'SALES TODAY',1],[td.length,'ORDERS TODAY'],[OR.filter(o=>o.status==='Pending').length,'PENDING'],[OR.filter(o=>o.status==='Confirmed'&&o.channel!=='pos').length,'TO SHIP'],[OR.filter(o=>o.status==='Shipped').length,'WITH COURIER']].map(a=>`<div class="${a[2]?'w':''}"><b>${a[0]}</b><small>${a[1]}</small></div>`).join('');
}

</script>
